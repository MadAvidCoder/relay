[package]
name = "relay"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
future-utils = "0.12.1"
futures-util = "0.3.34"
owo-colors = "4.4.0"
ratatui = "0.30.2"
ratatui-textarea = "0.9.4"
relay-common.workspace = true
sqlx = { version = "0.9.0", features = ["chrono", "runtime-tokio", "sqlite", "uuid"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"
uuid = "1.29.2"
