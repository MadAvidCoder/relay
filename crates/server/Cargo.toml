[package]
name = "relay-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
dotenvy = "0.15.7"
migrate = "0.5.1"
postgres = "0.19.14"
relay-common.workspace = true
sqlx = { version = "0.9.0", features = ["migrate", "postgres", "runtime-tokio", "uuid"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync"] }
uuid = "1.29.0"
